<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-body);color:var(--ink)}
.wrap{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-6);padding:var(--space-8)}
.card{background:var(--surface);border-radius:var(--radius-xl);padding:var(--space-8);box-shadow:var(--shadow-card);display:flex;flex-direction:column;gap:18px}
.card.primary{background:var(--primary);justify-content:center}
.label{font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0}
.primary .label{color:var(--on-primary-muted)}
.body{margin:0;font-size:15px;line-height:1.5}
.slogan{margin:0;font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1.25;color:var(--on-primary)}
</style></head>
<body><div class="wrap">
<div class="card"><p class="label">Tipografía</p><p class="body">Plus Jakarta Sans para el cuerpo de texto. Páginas web, sistemas simples y tableros de datos.</p></div>
<div class="card primary"><p class="label">Eslogan</p><p class="slogan">Conectamos ideas. Tejemos soluciones simples.</p></div>
</div></body></html>
