<!doctype html>
<html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
body{margin:0;background:var(--bg);font-family:var(--font-body)}
.row{display:flex;gap:var(--space-4);align-items:center;padding:var(--space-8)}
.btn{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--on-primary);background:var(--primary);border:none;border-radius:var(--radius-sm);padding:var(--space-2) var(--space-4);cursor:pointer;min-height:36px}
.btn:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn-lg{font-size:15px;padding:12px 20px;min-height:44px}

<body><div class="row">

<button type="button" class="btn btn-lg">Agenda una demo</button>
</div></body></html>
